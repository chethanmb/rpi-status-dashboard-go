<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🤖🍓 Raspberry Pi Status 🤖🍓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🤖🍓 Raspberry Pi Status 🤖🍓</h1>

  <div class="grid">
    <div class="card">CPU: <span id="cpu">--</span>%</div>
    <div class="card">Temp: <span id="temp">--</span>°C</div>
    <div class="card">Memory: <span id="mem">--</span></div>
    <div class="card">Disk: <span id="disk">--</span></div>
    <div class="card">Uptime: <span id="uptime">--</span></div>
    <div class="card">Host: <span id="host">--</span></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
